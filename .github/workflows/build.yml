name: Build document

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc make fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check sources
        run: make check
      - name: Build Word document
        run: make docx
      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: article-docx
          path: build/*.docx
          if-no-files-found: error
